services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: twynn_user
      POSTGRES_PASSWORD: twynn_password
      POSTGRES_DB: twynn
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U twynn_user -d twynn"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
